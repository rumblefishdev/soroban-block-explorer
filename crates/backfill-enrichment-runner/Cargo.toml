[package]
name = "backfill-enrichment-runner"
version = "0.1.0"
edition = "2024"
description = "Local CLI that drains un-enriched ClickHouse rows into the enrichment side tables (asset_enrichment / nft_enrichment, ADR 0050) by calling the same enrichment-shared::enrich_and_persist::* functions used by the live SQS-driven enrichment-worker Lambda. Single `enrich` binary with one subcommand per kind (`sep1-assets`, `nft-metadata`, `status`)."

[[bin]]
name = "enrich"
path = "src/main.rs"

[dependencies]
enrichment-shared = { path = "../enrichment-shared" }
# `aws-mtls` exposes `mtls::client_from_cli_flags`, the plain-or-mTLS client
# backfill-runner builds from the same flags (the production ClickHouse only
# accepts client certificates).
db-clickhouse = { path = "../db-clickhouse", features = ["aws-mtls"] }
clickhouse = { workspace = true }
# `getNetwork` on the RPC pool at start (network_guard.rs).
reqwest = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "signal", "time"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
indicatif = "0.18"
tracing-indicatif = "0.3"

[dev-dependencies]
# The canonical passphrases the network-guard tests feed in.
xdr-parser = { path = "../xdr-parser" }
