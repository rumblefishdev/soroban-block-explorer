[package]
name = "enrichment-worker"
version = "0.1.0"
edition = "2024"
description = "Type-1 enrichment worker Lambda — consumes SQS messages emitted by the indexer (Galaxy) Lambda and runs per-kind HTTP fetches that write the enriched values into the ClickHouse enrichment side tables (asset_enrichment / nft_enrichment, ADR 0050)."

[[bin]]
name = "enrichment-worker"
path = "src/main.rs"

[dependencies]
enrichment-shared = { path = "../enrichment-shared" }
db-clickhouse = { path = "../db-clickhouse", features = ["aws-mtls"] }
clickhouse = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
lambda_runtime = { workspace = true }
aws_lambda_events = { version = "0.16", default-features = false, features = ["sqs"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
