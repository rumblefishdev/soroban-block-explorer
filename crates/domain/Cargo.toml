[package]
name = "domain"
version = "0.1.0"
edition = "2024"
description = "Shared domain types for the Soroban block explorer"

[features]
default = []
# utoipa::ToSchema on the ADR 0031 enums for the OpenAPI spec.
# Enabled by the api crate.
utoipa = ["dep:utoipa"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
utoipa = { workspace = true, optional = true }
