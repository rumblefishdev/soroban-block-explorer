name: Deploy Production

# ─────────────────────────────────────────────────────────────────────────────
# Tag-driven production deploy.
#
#   • Release act = pushing a `production-YYYY.MM.DD-N[-SELECTOR]` tag (same
#     date-tag convention the retired staging pipeline used — see the four
#     historical `staging-2026.04.*` tags). The tag IS the human decision;
#     there is no separate approval gate by design (team decision
#     2026-08-10). The optional selector puts the deploy's SCOPE inside that
#     same decision, so widening a release stays one deliberate act:
#
#       production-2026.08.18-1              Compute + SPA — the standard
#                                            release set, unchanged default
#       production-2026.08.18-1-all          every stack that differs, + SPA
#       production-2026.08.18-1-CloudWatch   that stack alone, --exclusively,
#                                            no SPA
#       production-2026.08.18-1-web          SPA content only, no CDK deploy
#
#     Any selector other than `all` / `web` is appended to
#     `Explorer-production-` verbatim, so it must carry the stack's own case:
#     `Network`, `LedgerBucket`, `Compute`, `Ingestion`, `Delivery`,
#     `Observability`, `ApiGateway`, `CloudWatch`, `CloudflareBootstrap`,
#     `HetznerDns` (the list `infra/src/lib/app.ts` builds). A typo is not
#     silent — `cdk` fails on an unknown stack id before anything deploys.
#
#   • `-all` is not "deploy everything unconditionally": CDK skips stacks with
#     no changes, so it means "everything that actually differs". It is also
#     the only path that can ship parked, unreviewed drift — 0312's
#     CloudflareBootstrap delta sat undeployed for weeks and would have gone
#     out as a stowaway on any unrelated full deploy. Typing `-all` into the
#     tag name is what keeps that an explicit choice instead of a side
#     effect; `infra/Makefile` guards the laptop path with a typed `yes` for
#     the same reason.
#
#   • `workflow_dispatch` stays for deploys that should not mint a tag.
#   • Safety model:  build → `cdk diff` over ALL stacks → `cdk deploy` the
#     SELECTED stacks → smoke tests. The diff is deliberately wider than the
#     deploy: it is the release's drift record, and it is how a change parked
#     in a stack this tag does not ship becomes visible at release time
#     instead of being forgotten on someone's laptop. `--strict` because
#     without it `cdk diff` silently hides entries containing non-ASCII
#     characters (measured during the 0312 investigation).
#
# Prerequisites (inert until these exist):
#   1. GitHub environment `production` holding secrets AWS_DEPLOY_ROLE_ARN
#      (OIDC deploy role — the same one the legacy `staging` environment holds,
#      if it still has eu-central-1 CDK permissions) and AWS_ACCOUNT_ID, with
#      deployment policies allowing tag `production-*` and branch `master`.
#      Deliberately NO required reviewers — the tag is the approval; the
#      environment exists only to scope the secrets.
#   2. Region is eu-central-1 (where prod lives). CloudFront ACM certs remain
#      us-east-1 internally, but the stacks deploy to eu-central-1 via
#      production.json — do not change aws-region here.
#
# Release (always tag `origin/master`, always push the tag BY NAME — a local
# `master` is routinely stale, and `--tags` pushes every stale local tag too):
#   git fetch origin
#   git tag production-$(date -u +%Y.%m.%d)-1 origin/master
#   git push origin production-$(date -u +%Y.%m.%d)-1
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'production-*'
  workflow_dispatch:
    inputs:
      stacks:
        description: 'Stack id(s) to deploy, space-separated, or --all. Prefer ONE stack.'
        required: true
        default: 'Explorer-production-Compute'
      exclusively:
        description: 'Deploy ONLY the named stack(s), skip dependency stacks (--exclusively)'
        type: boolean
        default: true
      deploy_web:
        description: 'Also build + sync the SPA content (S3 + CloudFront invalidation)'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build + diff + deploy + smoke
    runs-on: ubuntu-latest
    # Secret scoping only — the environment has no required reviewers, so this
    # does NOT reintroduce an approval gate (the tag push is the approval).
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Resolve WHAT to deploy before spending 15 minutes building it, so a
      # malformed tag fails in seconds rather than after the synth. Both event
      # types land on the same three outputs, which is why every step below
      # reads `plan` and never `github.event_name`.
      - name: Plan — resolve the deploy scope
        id: plan
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # Grammar and mapping live in the script, which emits these exact
            # `key=value` lines and pins them in its own `--self-check`.
            if ! scope="$(./infra/scripts/deploy-scope.sh "${GITHUB_REF_NAME}")"; then
              echo "::error::malformed release tag '${GITHUB_REF_NAME}' — expected production-YYYY.MM.DD-N[-SELECTOR]"
              exit 1
            fi
          else
            excl='${{ inputs.exclusively && '--exclusively' || '' }}'
            # A human can type `--all` into the input; cdk rejects it paired
            # with --exclusively. (An `if`, not `[ … ] && …`: under `set -e` a
            # false test as the last statement of a block exits the step.)
            if [ '${{ inputs.stacks }}' = '--all' ]; then excl=''; fi
            scope="$(printf 'stacks=%s\nexclusively=%s\nweb=%s\n' \
              '${{ inputs.stacks }}' "$excl" '${{ inputs.deploy_web }}')"
          fi
          echo "$scope" >> "$GITHUB_OUTPUT"
          {
            echo '### Deploy scope'
            echo '```'
            echo "$scope"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-lambda
        run: pip3 install cargo-lambda
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Build CDK app
        run: npx nx build @rumblefish/soroban-block-explorer-aws-cdk
      # ALL stacks, not just the selected ones. This step is the release's
      # drift record: a delta parked in a stack this tag does not deploy shows
      # up here, at release time, in front of whoever cut the tag. Never add
      # `--fail` — a diff in an unselected stack is information, not an error,
      # and auto-deploying whatever differs is exactly the stowaway the `-all`
      # selector exists to make deliberate.
      - name: cdk diff — every stack, deployed or not
        run: |
          cd infra && npx cdk --app "node dist/bin/production.js" diff --strict
      - name: CDK deploy
        if: steps.plan.outputs.stacks != ''
        run: |
          cd infra && npx cdk --app "node dist/bin/production.js" \
            deploy ${{ steps.plan.outputs.stacks }} ${{ steps.plan.outputs.exclusively }} \
            --require-approval never
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
      # SPA content ships with the default and `-all` release sets (a release
      # the user can't see isn't shipped) and with the `-web` selector; a
      # single-stack tag leaves it alone, and dispatch opts in.
      - name: Deploy SPA content (build → S3 sync → CloudFront invalidation)
        if: steps.plan.outputs.web == 'true'
        run: make -C infra deploy-production-web
      - name: Smoke test — API /health (edge-lock-exempt, no secret needed)
        run: |
          API=$(aws cloudformation describe-stacks --region eu-central-1 \
            --stack-name Explorer-production-ApiGateway \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
            --output text)
          curl -f --retry 3 --retry-delay 5 "${API%/}/health"
      - name: Smoke test — Frontend (public, no basic-auth on prod)
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 \
            https://sorobanscan.rumblefish.dev/)
          if [ "$CODE" != "200" ]; then
            echo "::error::frontend smoke failed: HTTP ${CODE}"; exit 1
          fi
          echo "frontend smoke OK: HTTP ${CODE}"
