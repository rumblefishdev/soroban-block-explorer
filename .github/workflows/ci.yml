name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on a branch — a new push to a PR makes the previous
# run's remaining minutes wasted. master is never cancelled (merges are rare
# and the trunk build must always complete).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      typescript: ${{ steps.filter.outputs.typescript }}
      api_types_codegen: ${{ steps.filter.outputs.api_types_codegen }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              # The CH e2e leg of the rust job provisions ClickHouse from the
              # compose file (image pin + schema sidecar), so compose changes
              # must re-run it.
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            typescript:
              - 'apps/**'
              - 'libs/**'
              - 'web/**'
              - 'infra/**'
              # The infra declared-vs-emitted test (task 0455) reads Rust
              # sources: alarm filter fields/strings must exist at a
              # crates/ emit site. A Rust-only rename must re-run it.
              - 'crates/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'nx.json'
              - '.github/workflows/ci.yml'
            api_types_codegen:
              - 'crates/api/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'libs/api-types/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  typescript:
    name: TypeScript (lint, build, typecheck)
    needs: changes
    if: |
      needs.changes.outputs.typescript == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx nx format:check --all
      - run: npx nx run-many -t lint build typecheck test

      # Browser regression for the account page (issue #377, task 0463). The
      # three assertions there are the ones jsdom cannot make — real history
      # for the Back button, real layout for the 1,015-row pager — so the
      # suite needs a real browser, and the runner image ships none. ~95 MB.
      #
      # Not cached: one download per run beats cache-key bookkeeping while
      # this is a single-browser, three-test suite. Add actions/cache on
      # ~/.cache/ms-playwright if the suite or the browser list grows.
      #
      # The API is intercepted inside the tests (page.route), so this needs no
      # ClickHouse certificate and no network beyond the browser download.
      - run: npx playwright install --with-deps chromium
      - run: npx nx run @rumblefish/soroban-block-explorer-web:e2e

      # The release tag → deploy scope mapping. Cheap, and the only guard on
      # the case that matters: a plain `production-*` tag must stay
      # Compute-only, never `--all` (task 0455). Runs here because the
      # `typescript` filter already covers `infra/**`.
      - name: Deploy-scope mapping self-check
        run: ./infra/scripts/deploy-scope.sh --self-check

  api-types-codegen:
    name: API types freshness
    needs: changes
    if: |
      needs.changes.outputs.api_types_codegen == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-rust
      - run: npm ci
      - run: npx nx run @rumblefish/api-types:check-generated

  # Formatting is compile-free, so it runs as its own tiny job (~30s) instead
  # of sitting behind clippy/test/lambda in the main rust job. Fast red on the
  # most common CI failure without waiting on a full workspace build.
  rust-fmt:
    name: Rust fmt
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  rust:
    name: Rust (clippy, test)
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04-arm
    env:
      SQLX_OFFLINE: 'true'
      # line-tables debug: keeps file:line in panic backtraces (readable CI logs)
      # without the full debug info the build doesn't need. RUST_BACKTRACE so a
      # failing test actually prints where it panicked.
      CARGO_PROFILE_DEV_DEBUG: '1'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-rust

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # The api crate ships `swagger-ui` as an opt-in feature (task
      # 0042). Production Lambda builds stay on default features to
      # keep the binary lean (~4 MB vs ~15 MB). CI validates both
      # configurations so neither path bit-rots.
      - run: cargo clippy -p api --all-targets --features swagger-ui -- -D warnings
      - run: cargo test -p api --features swagger-ui

      # ClickHouse-gated e2e (task 0406). The suites self-skip when
      # CLICKHOUSE_URL is unset, so the plain `cargo test` above has
      # never executed them — the 0304 `sc.name` breakage reached prod
      # green. Same image (pinned to the prod major, 26.3) and same
      # schema path as local dev: the compose sidecar applies
      # `crates/db-clickhouse/schema/init.sql` before the run.
      - name: Start ClickHouse
        run: |
          docker compose up -d clickhouse
          docker compose run --rm db-clickhouse-init

      # Two gates (documented in 0394/0406): the CLICKHOUSE_URL-gated
      # tests run once the env var is set; the #[ignore]d enrichment
      # tests additionally need `--ignored` and are name-filtered to
      # the CH-only ones — the rest of the #[ignore] set needs live
      # mainnet RPC / S3 / issuer TOML endpoints and stays manual.
      # --test-threads=1: the suites seed shared tables with sentinel
      # rows and clean up with ALTER DELETE; parallel runs against one
      # server race each other.
      # The count guard keeps the --ignored leg honest: a drifted name
      # filter would otherwise match nothing and pass green — the same
      # silent skip this job exists to end.
      - name: ClickHouse e2e
        shell: bash
        env:
          CLICKHOUSE_URL: http://localhost:8123
          CLICKHOUSE_PASSWORD: clickhouse
        run: |
          # Both legs ALWAYS run, then the job fails on any of them. Under the
          # default `bash -e`, a red first leg aborted the step, so the
          # #[ignore] leg and its count guard never ran — one red run told you
          # about one half. `--no-fail-fast` already buys completeness inside a
          # leg; this buys it across legs, which is the same reason this job
          # exists (no silent skips).
          set +e
          cargo test --no-fail-fast -p db-clickhouse -p backfill-runner -- --test-threads=1
          gated_status=$?
          cargo test --no-fail-fast -p backfill-enrichment-runner -p enrichment-shared -- --ignored --test-threads=1 \
            select_sep1_chunk select_nft_chunk filter_drops | tee ignored-run.log
          ignored_status=${PIPESTATUS[0]}
          set -e
          passed=$(grep -Eo '[0-9]+ passed' ignored-run.log | awk '{s+=$1} END {print s}')
          if [ "${passed:-0}" -lt 5 ]; then
            echo "::error::expected >=5 CH-only #[ignore] tests to pass, got ${passed:-0} — did the name filters drift?"
            exit 1
          fi
          if [ "$gated_status" -ne 0 ] || [ "$ignored_status" -ne 0 ]; then
            echo "::error::ClickHouse e2e failed (env-gated leg: $gated_status, #[ignore] leg: $ignored_status)"
            exit 1
          fi

  # The release Lambda build shares no compilation with the debug clippy/test
  # steps (different profile), so it runs as its own job in parallel with `rust`
  # instead of serially behind it — roughly halving the Rust critical path.
  # Distinct rust-cache key (release target/ would thrash the debug job's cache).
  rust-lambda:
    name: Rust (lambda build)
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04-arm
    env:
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4

      # PINNED, and not to be moved to @stable without checking the note below.
      # Rust 1.98.0 (2026-08-20) started passing `--fix-cortex-a53-843419` to
      # the linker for aarch64-unknown-linux-gnu. `cargo lambda build --arm64`
      # links through zig, whose linker rejects that argument:
      #
      #   error: unsupported linker arg: --fix-cortex-a53-843419
      #   error: could not compile `crc-fast` (lib)
      #
      # It broke this job mid-day on a DOCS-ONLY commit — the runner upgraded
      # itself ("stable-aarch64 updated - rustc 1.98.0 (from rustc 1.97.1)"),
      # so nothing in the repo changed. cargo-zigbuild filters the argument
      # from 0.23.0 on (PR #452, 2026-06-10), but cargo-lambda 1.9.1 — the
      # newest release — hard-depends on cargo-zigbuild 0.20.1, so there is no
      # upgrade path through cargo-lambda today.
      #
      # UNPIN when cargo-lambda ships a release depending on cargo-zigbuild
      # >= 0.23.0. The other Rust jobs stay on @stable: they build natively,
      # never through zig, and are green on 1.98.0.
      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-rust-lambda

      - name: Install cargo-lambda
        run: pip3 install cargo-lambda

      - run: cargo lambda build --release --arm64

      - name: Verify Lambda artifacts
        shell: bash
        run: |
          shopt -s failglob
          echo "=== Lambda bootstrap binaries ==="
          for bin in target/lambda/*/bootstrap; do
            echo "$(sha256sum "$bin") $(stat --format='%s bytes' "$bin")"
          done
