name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on a branch — a new push to a PR makes the previous
# run's remaining minutes wasted. master is never cancelled (merges are rare
# and the trunk build must always complete).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      typescript: ${{ steps.filter.outputs.typescript }}
      api_types_codegen: ${{ steps.filter.outputs.api_types_codegen }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            typescript:
              - 'apps/**'
              - 'libs/**'
              - 'web/**'
              - 'infra/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'nx.json'
              - '.github/workflows/ci.yml'
            api_types_codegen:
              - 'crates/api/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'libs/api-types/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  typescript:
    name: TypeScript (lint, build, typecheck)
    needs: changes
    if: |
      needs.changes.outputs.typescript == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx nx format:check --all
      - run: npx nx run-many -t lint build typecheck test

  api-types-codegen:
    name: API types freshness
    needs: changes
    if: |
      needs.changes.outputs.api_types_codegen == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-rust
      - run: npm ci
      - run: npx nx run @rumblefish/api-types:check-generated

  # Formatting is compile-free, so it runs as its own tiny job (~30s) instead
  # of sitting behind clippy/test/lambda in the main rust job. Fast red on the
  # most common CI failure without waiting on a full workspace build.
  rust-fmt:
    name: Rust fmt
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  rust:
    name: Rust (clippy, test)
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04-arm
    env:
      SQLX_OFFLINE: 'true'
      # line-tables debug: keeps file:line in panic backtraces (readable CI logs)
      # without the full debug info the build doesn't need. RUST_BACKTRACE so a
      # failing test actually prints where it panicked.
      CARGO_PROFILE_DEV_DEBUG: '1'
      RUST_BACKTRACE: '1'
      # Eleven tests across six API modules are gated on `CH_URL` and skip
      # without it — silently reporting green while touching nothing. The step
      # below starts the same ClickHouse the compose file gives developers, so
      # they actually run. `test_client_from_env` hard-fails if this ever stops
      # being set under CI.
      CH_URL: http://127.0.0.1:8123
      CH_USER: default
      CH_PASSWORD: clickhouse
      CH_DATABASE: default
      # Marks this job as one that promised a ClickHouse. If the step below
      # ever stops setting CH_URL, the tests fail loudly here instead of
      # skipping back into a green lie. Only this job sets it — the
      # `typescript` job also runs `cargo test --workspace` through the nx
      # graph, with no ClickHouse and no need for one.
      CH_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4

      # Reuses `docker-compose.yml` rather than declaring a `services:` block,
      # so CI and local development apply the same image, the same XML config
      # overrides and the same `init.sql` — one definition, not two that drift.
      # `--wait` blocks on the healthcheck; the init sidecar exits once the
      # schema is applied, so it runs via `run --rm` instead of `up`.
      - name: Start ClickHouse and apply the canonical schema
        run: |
          docker compose up -d --wait clickhouse
          docker compose run --rm db-clickhouse-init
          curl -sS --fail-with-body \
            --user "$CH_USER:$CH_PASSWORD" \
            --data-binary "SELECT count() FROM system.tables WHERE database = 'default'" \
            "$CH_URL"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-rust

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # The api crate ships `swagger-ui` as an opt-in feature (task
      # 0042). Production Lambda builds stay on default features to
      # keep the binary lean (~4 MB vs ~15 MB). CI validates both
      # configurations so neither path bit-rots.
      - run: cargo clippy -p api --all-targets --features swagger-ui -- -D warnings
      - run: cargo test -p api --features swagger-ui

  # The release Lambda build shares no compilation with the debug clippy/test
  # steps (different profile), so it runs as its own job in parallel with `rust`
  # instead of serially behind it — roughly halving the Rust critical path.
  # Distinct rust-cache key (release target/ would thrash the debug job's cache).
  rust-lambda:
    name: Rust (lambda build)
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04-arm
    env:
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-rust-lambda

      - name: Install cargo-lambda
        run: pip3 install cargo-lambda

      - run: cargo lambda build --release --arm64

      - name: Verify Lambda artifacts
        shell: bash
        run: |
          shopt -s failglob
          echo "=== Lambda bootstrap binaries ==="
          for bin in target/lambda/*/bootstrap; do
            echo "$(sha256sum "$bin") $(stat --format='%s bytes' "$bin")"
          done
