# Hetzner installimage configuration for ch-prod-01.
#
# This file is consumed by Hetzner's `installimage` script (run
# from the Hetzner Rescue System) and describes the desired
# bare-metal layout. It is NOT executed by the Ansible playbook —
# the playbook picks up from "fresh Ubuntu, SSH reachable".
#
# Committed for reproducibility and disaster recovery: if the box
# is destroyed and re-ordered, this is the canonical input to
# `installimage` instead of clicking through the Robot UI form.
#
# ## Layout
#
#   md0 (RAID 1, 1 GiB, ext4)  → /boot
#   md1 (RAID 1, rest, ext4)   → /
#   no swap
#
# ## Why no swap
#
# 128 GiB RAM with `max_server_memory_usage` capped at 100 GiB
# leaves ~28 GiB headroom for the OS, Caddy, and the kernel page
# cache. Swap would mask memory pressure (CH degrades sharply on
# swap activity) and is contraindicated for a single-purpose DB
# host. If memory pressure appears, the right fix is to lower
# `max_server_memory_usage` in `config.d/memory.xml`, not to
# paper over it with swap.
#
# ## Why separate /boot
#
# Keeps the bootloader on a small dedicated FS so a full-disk
# recovery does not have to read past kernel/initrd to start. Also
# trivial to back up independently.

# --- Hardware / RAID --------------------------------------------------

DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1

SWRAID 1
SWRAIDLEVEL 1

# --- OS image ---------------------------------------------------------

# Use the latest LTS Ubuntu Server image shipped by Hetzner.
IMAGE /root/.oldroot/nfs/install/../images/Ubuntu-2404-noble-amd64-base.tar.gz

# --- Hostname ---------------------------------------------------------

HOSTNAME ch-prod-01

# --- Partitioning -----------------------------------------------------

# 2 GiB boot partition, ext4. mdadm RAID 1 across both NVMes.
# Ubuntu LTS retains 2-3 kernels by default; HWE kernels are
# ~90 MiB each + ~150 MiB initrd, so a 1 GiB /boot fills up within
# a year under automatic security upgrades — `unattended-upgrades`
# then silently fails to install patches. 2 GiB leaves comfortable
# headroom for the lifetime of the LTS release.
PART /boot ext4 2048M

# Everything else: ext4 root, RAID 1. No swap by design (see above).
PART /     ext4 all

# --- Post-install -----------------------------------------------------

# Ansible will deliver every subsequent change. `installimage`
# is the only manual step on a fresh order; from the next boot
# the box is reachable by SSH and the playbook takes over.
