---
# Daily encrypted backup of the ClickHouse data set to the
# Hetzner BX21 Storage Box via Borg over SSH.
#
# Workflow (executed by /usr/local/bin/ch-backup on cron):
#   1. `BACKUP DATABASE default TO Disk('backups', ...)` inside CH
#      → produces a consistent snapshot in /srv/backups/.
#   2. `borg create` pushes the snapshot directory to BX21.
#   3. Local snapshot is deleted (it has been pushed; BX21 is
#      the durable copy).
#   4. `borg prune` enforces retention.
#
# Encryption: Borg encrypts client-side using the passphrase from
# /etc/soroban-backup/borg.passphrase. Hetzner stores ciphertext;
# a Hetzner-side disclosure does not leak our data.

- name: Assert the Storage Box SSH endpoint is known before configuring Borg
  # storagebox_ssh_user/host are normally DISCOVERED by the
  # `storagebox` reconcile play (set_fact onto this host) and are no
  # longer required env vars. But a run that excludes the
  # `storagebox` tag (e.g. `--tags backup`, `--tags hetzner,backup`)
  # skips discovery, leaving them empty — which would silently bake
  # `ssh://@:23/...` into /usr/local/bin/ch-backup and ssh-keyscan an
  # empty host. Fail fast with an actionable message instead.
  ansible.builtin.assert:
    that:
      - storagebox_ssh_user | trim | length > 0
      - storagebox_ssh_host | trim | length > 0
    fail_msg: |
      The Storage Box SSH endpoint (storagebox_ssh_user / storagebox_ssh_host)
      is empty. It is discovered by the `storagebox` play, which this run did
      not include. Either:
        * run the full playbook (or add `--tags storagebox` to your tag set),
          so the subaccount is reconciled and the endpoint discovered, or
        * for a `--tags backup`-only re-run, export STORAGEBOX_SSH_USER and
          STORAGEBOX_SSH_HOST (the values the `storagebox` play printed on the
          last full run) before invoking ansible-playbook.

- name: Install Borg
  ansible.builtin.apt:
    name: borgbackup
    state: present

- name: Ensure /etc/soroban-backup exists
  ansible.builtin.file:
    path: /etc/soroban-backup
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deliver Borg passphrase file
  # Mode 0400, root-owned. The cron entry runs as root and reads
  # this file; no other user on the box can.
  ansible.builtin.copy:
    dest: /etc/soroban-backup/borg.passphrase
    content: '{{ borg_passphrase }}'
    owner: root
    group: root
    mode: '0400'
  no_log: true

  # NOTE: the host-side clickhouse-client credentials file at
  # /etc/soroban-backup/clickhouse-client.xml is delivered by the
  # `app` role, NOT here. The file must exist before `docker
  # compose up` runs (otherwise Docker auto-creates the bind
  # mount target as a directory), and compose up is in the `app`
  # role. The credentials file is functionally a backup-script
  # input, but lifecycle-wise it has to land at compose time.

- name: Ensure /root/.ssh exists with correct permissions
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Ensure /root/.ssh/known_hosts exists
  ansible.builtin.file:
    path: /root/.ssh/known_hosts
    state: touch
    owner: root
    group: root
    mode: '0600'
  changed_when: false

- name: Check if the Storage Box SSH host key is already pinned
  # ssh-keygen -F returns 0 if a matching entry exists, non-zero
  # otherwise. Avoids the previous task's `creates:` foot-gun:
  # that marker made the task always skip after the first run,
  # so a legitimate Storage Box host-key rotation would never
  # be picked up. Splitting check + add lets re-runs catch real
  # drift.
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -F [{{ storagebox_ssh_host }}]:{{ storagebox_ssh_port }}
      -f /root/.ssh/known_hosts
  register: known_host_check
  failed_when: false
  changed_when: false

- name: Pin the Storage Box SSH host key (TOFU)
  # Trust-on-first-use accept. Runs only when ssh-keygen -F
  # reports the entry is missing. A future Storage Box host-key
  # rotation requires manual removal from known_hosts before
  # the next playbook run — a deliberate guard against silent
  # MITM during routine ops.
  ansible.builtin.shell:
    cmd: >-
      ssh-keyscan -H -p {{ storagebox_ssh_port }}
      {{ storagebox_ssh_host }} >> /root/.ssh/known_hosts
  when: known_host_check.rc != 0

- name: Generate a dedicated SSH key for the backup cron
  # Distinct from the operator keys so revocation is independent
  # (e.g. compromised box → rotate only the backup key, devs still
  # in business).
  community.crypto.openssh_keypair:
    path: /root/.ssh/borg_ed25519
    type: ed25519
    owner: root
    group: root
    mode: '0600'
  register: borg_ssh_key

- name: Read the previously-recorded Borg SSH key fingerprint
  # Drift detector: if `/root/.ssh/borg_ed25519` was ever wiped
  # and re-generated (operator error, disk replacement, restore
  # gone wrong), the public part diverges from the one registered
  # on the Storage Box. Without detection the backup cron starts
  # failing silently. We store the SHA-256 fingerprint after each
  # successful run and compare on subsequent runs.
  ansible.builtin.slurp:
    src: /etc/soroban-backup/borg.fp
  register: borg_fp_recorded
  failed_when: false
  changed_when: false

- name: Compute the current Borg SSH key fingerprint
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -lf
      - /root/.ssh/borg_ed25519.pub
  register: borg_fp_current
  changed_when: false

- name: Warn on Borg SSH key drift when the storagebox play will re-authorise it
  # Drift is non-fatal ONLY when the `storagebox` play runs in this
  # same invocation: its `authorize` play (after this role) re-pushes
  # the CURRENT pubkey to the subaccount, so a regenerated keypair
  # self-heals. A hard fail here would abort before that heal.
  ansible.builtin.debug:
    msg: |
      NOTICE: the Borg cron SSH key fingerprint changed since the
      last run:

        recorded: {{ borg_fp_recorded.content | b64decode | trim }}
        current:  {{ borg_fp_current.stdout }}

      The hetzner_storagebox `authorize` play will re-authorise the
      current key on the subaccount later in this run. If you did NOT
      expect a regeneration (disk swap, botched restore), investigate
      why /root/.ssh/borg_ed25519 was recreated.
  when:
    - borg_fp_recorded.content is defined
    - (borg_fp_recorded.content | b64decode | trim) != borg_fp_current.stdout
    - (('all' in ansible_run_tags) or ('storagebox' in ansible_run_tags)) and ('storagebox' not in ansible_skip_tags)

- name: Fail on Borg SSH key drift when this run will NOT re-authorise it
  # When `storagebox` is excluded (e.g. --tags backup), the authorize
  # play does not run, so the new pubkey would never reach the
  # subaccount and the cron would silently fail against the stale
  # authorized_keys. Stop and tell the operator to include the play.
  ansible.builtin.fail:
    msg: |
      The Borg cron SSH key fingerprint changed since the last run:

        recorded: {{ borg_fp_recorded.content | b64decode | trim }}
        current:  {{ borg_fp_current.stdout }}

      This run does NOT include the `storagebox` play, so the new key
      would NOT be authorised on the Storage Box subaccount and the
      backup cron would fail. Re-run including the `storagebox` tag
      (or the full playbook) so the new key is re-authorised.
  when:
    - borg_fp_recorded.content is defined
    - (borg_fp_recorded.content | b64decode | trim) != borg_fp_current.stdout
    - (not (('all' in ansible_run_tags) or ('storagebox' in ansible_run_tags))) or ('storagebox' in ansible_skip_tags)

# NOTE: the drift baseline /etc/soroban-backup/borg.fp is RECORDED by
# the hetzner_storagebox `authorize` play, AFTER it confirms the key is
# authorised on the subaccount — not here. Recording it here would mark
# a regenerated key as "known good" on a `--tags backup` run that never
# re-authorised it, silently erasing the drift signal on the next run.

- name: Note who authorises this key on the Storage Box
  # The Borg pubkey is registered on the Storage Box SUBACCOUNT
  # automatically by the `hetzner_storagebox` role's `authorize`
  # play (which runs after this role) — it writes the subaccount
  # `~/.ssh/authorized_keys` over SFTP. The old manual "add via
  # Robot UI" step is gone (the Robot Storage Box API was removed
  # 2025-07-30; Storage Boxes live in the Cloud API now). This
  # debug only echoes the key for the run log.
  ansible.builtin.debug:
    msg: |
      Borg cron public key (authorised on the Storage Box subaccount
      by the hetzner_storagebox role, not by hand):

      {{ borg_ssh_key.public_key }}

- name: Deliver the backup script
  ansible.builtin.template:
    src: ch-backup.sh.j2
    dest: /usr/local/bin/ch-backup
    owner: root
    group: root
    mode: '0750'

- name: Install the weekly backup cron entry
  # WEEKLY cadence (task 0236): `weekday` pins the run to one day
  # (default Sunday = 0). Set BORG_CRON_WEEKDAY=* to restore daily runs.
  ansible.builtin.cron:
    name: 'ch-backup'
    user: root
    minute: '{{ borg_cron_minute }}'
    hour: '{{ borg_cron_hour }}'
    weekday: '{{ borg_cron_weekday }}'
    job: '/usr/local/bin/ch-backup >> /var/log/ch-backup.log 2>&1'
    cron_file: ch-backup

- name: Ensure /var/log/ch-backup.log exists and rotates
  # 26 weeks ≈ 6 months. Backup-pipeline log volume is tiny (a
  # few KiB per daily run) so retention is cheap; an incident
  # opened months after a silent backup failure can still trace
  # the regression to its first occurrence.
  ansible.builtin.copy:
    dest: /etc/logrotate.d/ch-backup
    content: |
      /var/log/ch-backup.log {
          weekly
          rotate 26
          compress
          delaycompress
          missingok
          notifempty
          create 0640 root adm
      }
    owner: root
    group: root
    mode: '0644'
