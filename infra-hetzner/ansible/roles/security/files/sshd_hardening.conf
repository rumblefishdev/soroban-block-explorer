# Managed by infra-hetzner/ansible/roles/security — do not edit by hand.
#
# Drop-in placed in /etc/ssh/sshd_config.d/. Settings here override
# the corresponding entries in the main sshd_config, regardless of
# OS package updates that may rewrite the main file.
#
# Each setting is paired with the threat it addresses.

# No password authentication — keys only. Removes brute-force as
# an attack vector entirely; fail2ban below is hygiene rather
# than primary defence.
PasswordAuthentication no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
UsePAM yes

# No root login over SSH. The deploy user with passwordless sudo
# (via /etc/sudoers.d/deploy) is the supported admin path.
PermitRootLogin no

# Empty passwords disabled defensively even though PasswordAuth
# above already covers it.
PermitEmptyPasswords no

# No X11 forwarding, no agent forwarding by default. Re-enable
# per-session with ssh -X / -A if needed; the default-off posture
# avoids accidental key disclosure to a compromised box.
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no

# Refuse stale / hung connections. 5 minute idle limit; client
# alive probes catch dead sockets quickly.
ClientAliveInterval 300
ClientAliveCountMax 2

# Cap concurrent unauthenticated connections to defeat connection
# floods.
MaxStartups 10:30:60
LoginGraceTime 30

# Conservative modern crypto. Drops the legacy DH groups, MD5
# HMACs, and CBC ciphers that openssh-server keeps for
# compatibility.
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256
