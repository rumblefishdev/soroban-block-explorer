---
# Group variables shared across every host in the inventory.
#
# Per-deployment values are sourced from the operator's shell
# environment via the `lookup('env', ...)` plugin. The canonical
# password-manager entry `soroban-prod / ansible-env` is the
# single source of truth — every value listed here that is
# "required" must be exported before invoking ansible-playbook.
#
# `error_on_undefined_vars = true` in ansible.cfg ensures any task
# that consumes an unset variable fails at template time, not at
# runtime. A pre-flight `assert` in site.yml turns the failure
# into a specific actionable message.
#
# Variables with `| default(<value>, true)` are overridable via env
# but ship with a team-policy default. Variables hardcoded below
# the "System facts" line are NOT env-configurable because they
# are coupled to the Docker image, Compose contract, or playbook
# implementation — overriding them would break the deploy.

# ---------------------------------------------------------------------
# Required env vars — playbook fails preflight if unset
# ---------------------------------------------------------------------

hcloud_robot_user: "{{ lookup('env', 'HCLOUD_ROBOT_USER') }}"
hcloud_robot_password: "{{ lookup('env', 'HCLOUD_ROBOT_PASSWORD') }}"
clickhouse_password: "{{ lookup('env', 'CLICKHOUSE_PASSWORD') }}"
borg_passphrase: "{{ lookup('env', 'BORG_PASSPHRASE') }}"

# Hetzner Cloud API token — distinct from the Robot webservice
# user/password above. Required by the `hetzner_storagebox` role
# to reconcile the Borg Storage Box subaccount via the Cloud API
# (the legacy Robot Storage Box endpoints were removed 2025-07-30).
# Create a read+write token in Hetzner Console → Security → API
# tokens. Scoped to the project that owns the Storage Box.
hcloud_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"

# Numeric Cloud ID of the BX21 Storage Box (Hetzner Console →
# Storage Boxes → the box → its ID, NOT the `uNNNNNN` username).
# Used as the `storage_box` selector for the subaccount modules.
storagebox_id: "{{ lookup('env', 'STORAGEBOX_ID') }}"

# Password set on the Borg subaccount. The Cloud API requires a
# password at subaccount-create time; we also use it for the
# transient SFTP login that installs the cron's authorised_keys
# (no API surface manages SSH keys). Random 32-byte base64, stored
# in the password manager alongside the other secrets. Borg itself
# authenticates with the ed25519 key once authorised — this
# password is never used by the daily cron.
#
# ROTATION CAVEAT: changing this value is NOT auto-applied to an
# existing subaccount — the Cloud API does not expose the current
# password to diff against, and the role only resets it on the
# bootstrap path (when key auth is denied). To apply a rotation,
# reset it once via the Hetzner Console, or run
# `hetzner.hcloud.storage_box_subaccount` with `state: reset_password`.
storagebox_subaccount_password: "{{ lookup('env', 'STORAGEBOX_SUBACCOUNT_PASSWORD') }}"

# Public DNS name Caddy serves on. The Hetzner Robot reverse-DNS
# entry should match. Let's Encrypt validates http-01 against this
# hostname. Per-environment in the CDK config (see EnvironmentConfig
# `chDomainName`); the Ansible side reads it from the operator's
# shell env so the playbook stays env-agnostic.
ch_domain: "{{ lookup('env', 'CH_DOMAIN') }}"

# Let's Encrypt account email — receives expiry-warning mail.
acme_email: "{{ lookup('env', 'ACME_EMAIL') }}"

# Operator-supplied SSH public keys (one per line, OpenSSH
# format). Replaces the previous github.com/<user>.keys fetch
# pattern — no external network dependency at deploy time, no
# coupling to GitHub account state. The `users` role writes
# this verbatim to /home/<deploy_user>/.ssh/authorized_keys.
#
# Multi-line example (in ~/.config/soroban-prod.env):
#   export OPERATOR_SSH_PUBKEYS="$(cat <<'EOF'
#   ssh-ed25519 AAAA... alice@laptop
#   ssh-rsa     AAAA... bob@laptop
#   EOF
#   )"
operator_ssh_pubkeys: "{{ lookup('env', 'OPERATOR_SSH_PUBKEYS') }}"

# Comma-separated `<cn>:<ch_user>` pairs. Caddy's `map` directive
# (rendered into snippets/cn_user_map.snippet) uses this to:
#   1. Allow only listed CNs (the map IS the allowlist — unmapped
#      certs leave `{ch_user}` empty and the site block returns 403).
#   2. Forward the resolved CH user to the backend as
#      `X-ClickHouse-User: <ch_user>`.
#
# Service certs map to scoped users (`api_reader`, `galexie`, …);
# dev certs map to `dev_shared` (admin user with `<no_password/>`,
# loopback/bridge-restricted — leaves the password-protected
# `default` unreachable via Caddy).
#
# Example:
#   export CLICKHOUSE_CN_USER_MAP="\
#     <dev1>-laptop:dev_shared,\
#     <dev2>-laptop:dev_shared,\
#     galexie-production:galexie,\
#     lambda-api-production:api_reader,\
#     lambda-ingestion-production:ingestion_writer,\
#     lambda-partition-production:partition_admin,\
#     lambda-migration-production:migration_admin"
clickhouse_cn_user_pairs: "{{ lookup('env', 'CLICKHOUSE_CN_USER_MAP').split(',') | map('trim') | reject('equalto', '') | list }}"

# Plain list of CNs derived from the pair list — used by the site.yml
# preflight regex check (the CN side of the pair must be in the
# issuance regex's safe character set) and by any other place that
# only needs the names, not the mapping.
allowed_client_cns: "{{ clickhouse_cn_user_pairs | map('regex_replace', '^([^:]+):.*$', '\\1') | list }}"

# Storage Box subaccount SSH credentials (BX21).
#
# These used to be REQUIRED env vars. They are now DISCOVERED by
# the `hetzner_storagebox` role from the Cloud API response
# (`username` → user, `server` → host) and `set_fact` onto this
# host before the `backup` role runs — on a fresh box the operator
# cannot know the Hetzner-assigned `uNNNNNN-subN` username up
# front. The env lookups below are an optional pin/override: if
# set, the role asserts the discovered values match (drift guard);
# if unset (the default), discovery fills them. For a targeted
# `--tags backup` re-run that skips the `storagebox` tag, set these
# in env to the values the role printed on the last full run.
storagebox_ssh_user: "{{ lookup('env', 'STORAGEBOX_SSH_USER') | default('', true) }}"
storagebox_ssh_host: "{{ lookup('env', 'STORAGEBOX_SSH_HOST') | default('', true) }}"

# ---------------------------------------------------------------------
# Operational defaults — env-overridable
# ---------------------------------------------------------------------

storagebox_ssh_port: "{{ lookup('env', 'STORAGEBOX_SSH_PORT') | default('23', true) | int }}"

# ---------------------------------------------------------------------
# Storage Box subaccount declarative state (hetzner_storagebox role)
# ---------------------------------------------------------------------

# Subaccount identity. `name` is the idempotent match key for the
# Cloud API module; `home_directory` is the chroot the subaccount
# is confined to (no leading slash — relative to the box root).
# The Borg repo path (`borg_repo_path`, default ./backups/clickhouse)
# is resolved relative to this home over SSH.
storagebox_subaccount_name: "{{ lookup('env', 'STORAGEBOX_SUBACCOUNT_NAME') | default('borg-backup-ch-prod-01', true) }}"
storagebox_subaccount_home: "{{ lookup('env', 'STORAGEBOX_SUBACCOUNT_HOME') | default('borg-ch-prod-01-repo', true) }}"

# Access methods on the subaccount. Borg needs SSH only; everything
# else stays off (least privilege). `reachable_externally: false`
# keeps the subaccount reachable only from inside Hetzner — the box
# (also in Hetzner) reaches it fine, and the authorised_keys install
# runs FROM the box, so no external exposure is required.
storagebox_subaccount_access:
  ssh_enabled: true
  samba_enabled: false
  webdav_enabled: false
  readonly: false
  reachable_externally: false

# ADDITIONAL SSH public keys to authorise on the subaccount, on top
# of the box's own Borg cron pubkey (which is ALWAYS authorised while
# the subaccount has SSH enabled — it is the backup identity, slurped
# from the box at run time). The role renders `authorized_keys` as an
# overwrite of {box pubkey} + this list, so removing or rotating an
# entry HERE is reconciled away on the next run (delta, not append).
# This list does NOT control the box key. To REVOKE the cron's access
# entirely, set `storagebox_subaccount_access.ssh_enabled: false` (the
# reconcile play disables SSH on the subaccount) or delete the
# subaccount via the Cloud API — see the DR runbook in README.
storagebox_authorized_keys: []

# First-run validation: after the key is wired, run `ch-backup`
# once and assert the repo lists a `ch-*` archive. Set false to
# skip the (potentially long) full-backup roundtrip on re-runs.
storagebox_run_backup_validation: "{{ lookup('env', 'STORAGEBOX_RUN_BACKUP_VALIDATION') | default('true', true) | bool }}"
borg_repo_path: "{{ lookup('env', 'BORG_REPO_PATH') | default('./backups/clickhouse', true) }}"

# Borg retention policy — overridable for envs with different
# capacity / retention requirements.
borg_keep_daily: "{{ lookup('env', 'BORG_KEEP_DAILY') | default('7', true) | int }}"
borg_keep_weekly: "{{ lookup('env', 'BORG_KEEP_WEEKLY') | default('4', true) | int }}"
borg_keep_monthly: "{{ lookup('env', 'BORG_KEEP_MONTHLY') | default('6', true) | int }}"

# Daily backup cron — UTC. Box is forced to UTC by the base role.
borg_cron_hour: "{{ lookup('env', 'BORG_CRON_HOUR') | default('3', true) | int }}"
borg_cron_minute: "{{ lookup('env', 'BORG_CRON_MINUTE') | default('30', true) | int }}"

# Local timezone for the host.
host_timezone: "{{ lookup('env', 'HOST_TIMEZONE') | default('Etc/UTC', true) }}"

# Hetzner Robot display label for the server (cosmetic in UI).
hetzner_server_name: "{{ lookup('env', 'HETZNER_SERVER_NAME') | default('ch-prod-01', true) }}"

# Optional Hetzner Robot server number — required ONLY to set the
# display label via `community.hrobot.server`. Visible in Robot
# UI → Server → top-right corner (#NNNNNNN). If unset, the role
# skips the rename task and the server keeps whatever label
# Robot UI defaults to. rDNS + firewall do not need this.
hetzner_server_number: "{{ lookup('env', 'HETZNER_SERVER_NUMBER') | default('', true) }}"

# Derived values — not directly env-driven.
borg_repo_url: 'ssh://{{ storagebox_ssh_user }}@{{ storagebox_ssh_host }}:{{ storagebox_ssh_port }}/{{ borg_repo_path }}'

# The Hetzner Robot play runs under `hosts: localhost` (the Robot
# REST API is a controller-side side-channel, not something the
# box itself reaches). In that context a bare `{{ ansible_host }}`
# resolves to `localhost` / `127.0.0.1`, which would point the
# reverse_dns and firewall modules at the wrong IP and surface
# as a confusing "IP not found" from the API. Resolving via
# `hostvars[groups['ch_prod'][0]].ansible_host` always returns
# the inventory-declared IP of the box regardless of which play
# is evaluating the variable.
hetzner_server_ipv4: "{{ hostvars[groups['ch_prod'][0]].ansible_host }}"
hetzner_reverse_dns: '{{ ch_domain }}'

# ---------------------------------------------------------------------
# System facts — NOT env-configurable
#
# These values are coupled to the Docker image, Compose contract,
# or playbook implementation. Changing them silently breaks the
# deploy — they are not config, they are facts. If a future
# refactor needs to vary one of these (e.g. different deploy
# user UID per env), promote it above this line with an env
# override.
# ---------------------------------------------------------------------

deploy_user: deploy
deploy_user_uid: 1100
# Separate from the UID so each end of the pairing can be re-aimed
# without confusing future readers. The two happen to coincide
# today; that is a convenience, not a property to rely on.
deploy_user_gid: 1100

# Where the operator's rsync lands on the box.
app_repo_dest: /srv/app

# Filesystem layout consumed by the compose prod overlay bind
# mounts. Ownership matches the in-container CH UID (101).
ch_data_dir: /srv/clickhouse-data
ch_logs_dir: /srv/clickhouse-logs
backups_dir: /srv/backups

# ClickHouse runs as UID/GID 101 inside the official 26.x image.
clickhouse_uid: 101
clickhouse_gid: 101

# Hetzner Robot stateless firewall rules at the network-switch
# level. Security policy lives in repo, not in env — these are
# version-controlled review artefacts.
#
# Rule names must match the Robot API's accepted character set
# [A-Za-z0-9_-]; spaces / punctuation are rejected by the
# `community.hrobot.firewall` module ≥ 1.9.
hetzner_firewall_rules:
  - name: 'ssh'
    dst_port: '22'
    protocol: 'tcp'
    action: 'accept'
  - name: 'http-acme'
    dst_port: '80'
    protocol: 'tcp'
    action: 'accept'
  - name: 'https-mtls'
    dst_port: '443'
    protocol: 'tcp'
    action: 'accept'
  - name: 'established'
    protocol: 'tcp'
    tcp_flags: 'ack'
    action: 'accept'
  - name: 'icmp'
    protocol: 'icmp'
    action: 'accept'
