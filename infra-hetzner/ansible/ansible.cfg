[defaults]
# Inventory lives next to this config. The example file is the
# committed template; the real inventory.ini is gitignored.
inventory = ./inventory.ini

# Where role/collection lookups look first. Roles live in-tree;
# external collections come from requirements.yml.
roles_path = ./roles
collections_path = ./collections:~/.ansible/collections

# Reduce noise from idempotent runs while still surfacing changes.
stdout_callback = default
display_skipped_hosts = false

# Forks beyond 1 buy us nothing on a single-host inventory.
forks = 1

# Cache facts for 10 minutes so repeated playbook runs in the
# same session do not re-gather them on every invocation.
fact_caching = jsonfile
fact_caching_connection = /tmp/soroban-ansible-facts
fact_caching_timeout = 600

# Make missing required vars fail at templating time rather than
# producing surprising empty strings downstream.
error_on_undefined_vars = true

# Pipelining reduces SSH round-trips; safe because we never use
# `become_method` configurations that require a TTY.
pipelining = true

[ssh_connection]
# Persist a control socket per host across tasks in the same run.
# Speeds up multi-task plays dramatically.
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
