<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Consent Mode: everything denied until the HubSpot banner says
         otherwise. Must run before GTM; the listener after the HubSpot loader
         sends the update. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500,
      });
    </script>
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : '';
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', 'GTM-TBF2GP5S');
    </script>
    <!-- End Google Tag Manager -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Soroban Block Explorer</title>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-TBF2GP5S"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Start of HubSpot Embed Code -->
    <script
      type="text/javascript"
      id="hs-script-loader"
      async
      defer
      src="//js.hs-scripts.com/8102665.js"
    ></script>
    <!-- End of HubSpot Embed Code -->
    <!-- Forward the banner choice to Google Consent Mode. HubSpot calls this on
         load with a stored choice and on every change (footer Cookie Settings
         included). Blocked HubSpot = never called = stays denied. -->
    <script>
      var _hsp = (window._hsp = window._hsp || []);
      _hsp.push([
        'addPrivacyConsentListener',
        function (consent) {
          var analytics = consent.categories.analytics ? 'granted' : 'denied';
          var ads = consent.categories.advertisement ? 'granted' : 'denied';
          gtag('consent', 'update', {
            analytics_storage: analytics,
            ad_storage: ads,
            ad_user_data: ads,
            ad_personalization: ads,
          });
        },
      ]);
    </script>
  </body>
</html>
